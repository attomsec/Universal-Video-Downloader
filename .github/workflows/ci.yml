name: Testes do Projeto Django

# GATILHOS: Quando esta ação deve rodar?
on:
  push:
    branches: [ "main", "master", "dev" ] # Rode em pushes para 'main' ou 'master'
  pull_request:
    branches: [ "main", "master", "dev" ] # Rode em pull requests para 'main' ou 'master'

# Tarefas
jobs:
  build:
    # O servidor virtual que o GitHub vai usar (um Ubuntu novinho)
    runs-on: ubuntu-latest
     
    steps:
      # Baixar o seu código do GitHub para o servidor
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Configurar o Python
      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      # Instalar as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rodar os testes
      - name: Rodar Testes (Pytest)
        run: |
          pytest